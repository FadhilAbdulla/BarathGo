<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Plus Jakarta Sans",Helvetica,Arial,sans-serif;color:#fff;background:#0459BF;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(80% 90% at 100% 0%,rgba(255,255,255,.16),rgba(255,255,255,0) 60%)}
.road{position:absolute;right:-80px;bottom:-40px;width:760px;height:220px;border-top:3px dashed rgba(255,255,255,.18);border-radius:50% 50% 0 0}
.wrap{position:relative;display:flex;align-items:center;gap:40px;height:100%;padding:0 80px 0 56px}
.logo{flex:none;width:400px}
.copy{flex:1}
.badge{display:inline-flex;align-items:center;gap:10px;padding:9px 18px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:20px;font-weight:700;letter-spacing:.04em}
.dot{width:10px;height:10px;border-radius:50%;background:#3ddc97}
h1{margin:26px 0 20px;font-size:58px;line-height:1.04;letter-spacing:-.035em;font-weight:800}
p{font-size:26px;line-height:1.4;color:rgba(255,255,255,.85);font-weight:500}
.foot{position:absolute;left:56px;right:80px;bottom:40px;display:flex;justify-content:space-between;font-size:21px;font-weight:700;color:rgba(255,255,255,.8)}
</style></head><body><div class="bg"></div><div class="road"></div>
<div class="wrap"><img class="logo" src="../public/brand/barathgo-logo.svg">
<div class="copy"><span class="badge"><span class="dot"></span>AN NFTCI INITIATIVE</span>
<h1>Fair rides, driven by India’s cooperatives.</h1>
<p>City, airport, outstation &amp; pilgrimage rides with verified local drivers.</p></div></div>
<div class="foot"><span>barathgo.com</span><span>Book a ride · Drive with us</span></div>
</body></html>
